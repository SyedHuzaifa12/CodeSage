[pytest]
asyncio_mode = auto
; Sprint 4's async clients (Postgres engine, Qdrant/Redis clients) are
; process-wide @lru_cache singletons bound to whichever event loop
; first constructs them — the correct pattern for a long-running
; server, but incompatible with pytest-asyncio's per-test event loop
; default (a client built under test A's loop breaks under test B's
; loop). Session-scoped loops make the whole test run behave like the
; single long-running event loop these singletons assume.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = app/tests
